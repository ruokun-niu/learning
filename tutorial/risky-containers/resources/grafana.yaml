apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.5.2
        env:
          - name: GF_SECURITY_ADMIN_USER
            value: "drasi"
          - name: GF_SECURITY_ADMIN_PASSWORD
            value: "drasi"
          - name: GF_INSTALL_PLUGINS
            value: "https://github.com/drasi-project/grafana-signalr/releases/download/v0.1.0-alpha/drasi-signalr-0.1.0-alpha.zip;drasi-signalr"
          - name: GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS
            value: "drasi-signalr"
          - name: GF_PLUGINS_ENABLE_ALPHA
            value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: config-volume
          mountPath: /etc/grafana/provisioning/datasources
      volumes:
      - name: config-volume
        configMap:
          name: grafana-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  datasources.yaml: |
    apiVersion: 1
    datasources: []
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  type: NodePort
  selector:
    app: grafana